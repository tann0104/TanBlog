<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Showcase</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen font-sans antialiased">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-teal-500 to-emerald-400 bg-clip-text text-transparent">
        My Showcase
      </h1>
      <button id="theme-toggle" class="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 hover:ring-2 ring-emerald-500 transition-all">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">

    <!-- 検索 & タグフィルター -->
    <section class="mb-10 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <input type="text" id="search-input" placeholder="プロジェクトを検索..." 
          class="w-full pl-4 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-emerald-500 transition">
      </div>

      <div class="flex gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0" id="tag-buttons">
        <button data-tag="" class="tag-btn active px-4 py-2 rounded-xl text-sm font-medium bg-emerald-500 text-white transition">すべて</button>
        <button data-tag="Web" class="tag-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-500/10 transition">Web</button>
        <button data-tag="App" class="tag-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-500/10 transition">App</button>
        <button data-tag="Game" class="tag-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-500/10 transition">Game</button>
      </div>
    </section>

    <!-- プロジェクト一覧グリッド -->
    <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-12 text-slate-400">読み込み中...</div>
    </div>

  </main>

  <!-- メインJavaScriptの読み込み -->
  <script src="script.js"></script>
</body>
</html>
