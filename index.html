<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sweet Portfolio ✨</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 外部CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen antialiased">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-pink-200/50 dark:border-pink-900/30">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent flex items-center gap-2">
        <span>🎀</span> My Showcase
      </h1>
      <button id="theme-toggle" class="cute-btn p-3 rounded-full bg-pink-100 dark:bg-purple-900/50 hover:bg-pink-200 dark:hover:bg-purple-800 transition-all shadow-sm">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">

    <!-- 検索 & タグフィルター -->
    <section class="mb-10 flex flex-col sm:flex-row gap-4 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <input type="text" id="search-input" placeholder="✨ プロジェクトをさがす..." 
          class="w-full pl-5 pr-5 py-3 rounded-full border-2 border-pink-200 dark:border-purple-800 bg-white/80 dark:bg-slate-900/80 focus:outline-none focus:border-pink-400 dark:focus:border-purple-400 transition shadow-sm placeholder-pink-300 dark:placeholder-purple-400">
      </div>

      <div class="flex gap-2 overflow-x-auto w-full sm:w-auto pb-2 sm:pb-0" id="tag-buttons">
        <button data-tag="" class="tag-btn cute-btn active px-5 py-2.5 rounded-full text-sm font-bold bg-gradient-to-r from-pink-400 to-rose-400 text-white shadow-md transition">すべて 🌈</button>
        <button data-tag="Web" class="tag-btn cute-btn px-5 py-2.5 rounded-full text-sm font-bold bg-white dark:bg-slate-800 text-pink-400 dark:text-purple-300 border-2 border-pink-200 dark:border-purple-800 hover:bg-pink-50 dark:hover:bg-purple-900/30 transition">Web 🌐</button>
        <button data-tag="App" class="tag-btn cute-btn px-5 py-2.5 rounded-full text-sm font-bold bg-white dark:bg-slate-800 text-pink-400 dark:text-purple-300 border-2 border-pink-200 dark:border-purple-800 hover:bg-pink-50 dark:hover:bg-purple-900/30 transition">App 📱</button>
        <button data-tag="Game" class="tag-btn cute-btn px-5 py-2.5 rounded-full text-sm font-bold bg-white dark:bg-slate-800 text-pink-400 dark:text-purple-300 border-2 border-pink-200 dark:border-purple-800 hover:bg-pink-50 dark:hover:bg-purple-900/30 transition">Game 🎮</button>
      </div>
    </section>

    <!-- プロジェクト一覧グリッド -->
    <div id="project-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-12 text-pink-300 dark:text-purple-400 font-bold">読み込み中... 🦄</div>
    </div>

  </main>

  <!-- メインJavaScriptの読み込み -->
  <script src="script.js"></script>
</body>
</html>
